<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Solar Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="login-page">

    <header>
        <h1>Solar Management System</h1>
        <p>Sign in to continue</p>
    </header>


    <main class="login-container">

        <div class="login-box">

            <h2>Log In</h2>

            <p class="login-subtitle">
                Enter your account details
            </p>


            <form id="loginForm">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    Remember me

                </label>


                <button
                    type="submit"
                    class="login-button">

                    Sign In

                </button>


                <p
                    id="loginMessage"
                    class="login-message">
                </p>

            </form>

        </div>

    </main>


    <footer>
        <p>Solar Management System</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
