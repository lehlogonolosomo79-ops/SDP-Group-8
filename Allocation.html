<!DOCTYPE html>
<html>
<head>
    <title>Allocations - SolarGen Tech</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>☀️ SolarGen Tech</h1>
    <p>Inventory Allocations</p>
</header>

<nav>
    <a href="Dashboard.html">Dashboard</a>
    <a href="Inventory.html">Inventory</a>
    <a href="Projects.html">Projects</a>
    <a href="Teams.html">Teams</a>
    <a href="Allocations.html">Allocations</a>
    <a href="Reports.html">Reports</a>
</nav>

<main>

    <h2>Allocate Inventory</h2>

    <div class="box">

        <label>Inventory Item</label>

        <select id="allocationItem"></select>

        <label>Project</label>

        <select id="allocationProject"></select>

        <button onclick="allocateItem()">
            Allocate Item
        </button>

    </div>

    <div class="box">

        <h3>Allocation History</h3>

        <table>

            <thead>
                <tr>
                    <th>Serial Number</th>
                    <th>Project</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="allocationList"></tbody>

        </table>

    </div>

</main>

<script src="script.js"></script>

</body>
</html>
